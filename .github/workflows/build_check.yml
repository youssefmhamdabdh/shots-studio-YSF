name: Build Check

on:
  push:
    branches: [main]
    paths:
      - "shots_studio/**"
      - ".github/workflows/"
  pull_request:
    branches: [main]
    paths:
      - "shots_studio/**"
      - ".github/workflows/"
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    name: Build (github)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: shots_studio/flutter.version
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: shots_studio

      - name: Build APK (github)
        run: >
          flutter build apk
          --flavor github
          --dart-define=BUILD_SOURCE=github
        working-directory: shots_studio

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-github
          path: shots_studio/build/app/outputs/flutter-apk/app-github-release.apk
